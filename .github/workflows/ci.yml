name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        run: |
          set -o pipefail
          govulncheck ./... 2>&1 | tee govulncheck_output.txt

      - name: Annotate action with findings
        if: steps.govulncheck.outcome == 'failure'
        run: |
          echo "::error title=govulncheck::Vulnerability found — see workflow summary for details"
          {
            echo "## govulncheck findings"
            echo '```'
            cat govulncheck_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment on findings
        if: steps.govulncheck.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## :warning: govulncheck findings'
            echo ''
            echo '```'
            cat govulncheck_output.txt
            echo '```'
            echo ''
            echo "See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          } > pr_comment.txt
          gh pr comment "${{ github.event.pull_request.number }}" --body-file pr_comment.txt

      - name: Fail on findings
        if: steps.govulncheck.outcome == 'failure'
        run: exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Skip PRs from docs/ or ci/ branches, and commits with those prefixes on main
    if: |
      !startsWith(github.head_ref, 'docs/') &&
      !startsWith(github.head_ref, 'ci/') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.head_ref, 'docs/') &&
      !startsWith(github.head_ref, 'ci/') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [govulncheck]
    if: |
      !startsWith(github.head_ref, 'docs/') &&
      !startsWith(github.head_ref, 'ci/') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./cmd/api
