<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pfötchen — Welcome</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0e0e10;color:#efeff1;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#18181b;border-radius:12px;padding:48px 40px;max-width:480px;width:100%}
  h1{font-size:1.6rem;font-weight:700;margin-bottom:6px}
  .sub{color:#adadb8;margin-bottom:32px;font-size:.95rem}
  label{display:block;color:#adadb8;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .token-row{display:flex;gap:8px;align-items:stretch}
  code{flex:1;background:#0e0e10;border:1px solid #2d2d35;border-radius:6px;padding:12px 14px;font-size:.9rem;word-break:break-all;display:block}
  button{background:#9147ff;color:#fff;border:none;border-radius:6px;padding:0 16px;font-weight:700;font-size:.85rem;cursor:pointer;transition:background .15s}
  button:hover{background:#772ce8}
  .note{margin-top:16px;color:#adadb8;font-size:.82rem}
  a.back{display:inline-block;margin-top:32px;color:#9147ff;text-decoration:none;font-size:.9rem}
  a.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <h1>Welcome, {{.UserName}}!</h1>
  <p class="sub">Your Twitch account is connected.</p>
  <label>Your API Token</label>
  <div class="token-row">
    <code id="tok">{{.ApiToken}}</code>
    <button onclick="navigator.clipboard.writeText(document.getElementById('tok').textContent);this.textContent='Copied!'">Copy</button>
  </div>
  <p class="note">Use this token as <strong>Authorization: Bearer &lt;token&gt;</strong> in all API requests.</p>
  <a class="back" href="/">← Back to login</a>
</div>
</body>
</html>
