<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pfötchen — Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0e0e10;color:#efeff1;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#18181b;border-radius:12px;padding:48px 40px;text-align:center;max-width:400px;width:100%}
  h1{font-size:2rem;font-weight:700;margin-bottom:8px}
  p{color:#adadb8;margin-bottom:32px}
  a.btn{display:inline-flex;align-items:center;gap:10px;background:#9147ff;color:#fff;text-decoration:none;font-weight:700;font-size:1rem;padding:14px 28px;border-radius:8px;transition:background .15s}
  a.btn:hover{background:#772ce8}
  .logo{font-size:2.5rem}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🐾</div>
  <h1>Pfötchen</h1>
  <p>Sign in with your Twitch account to get your API token.</p>
  <a class="btn" href="/auth/twitch">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
    Login with Twitch
  </a>
</div>
</body>
</html>
