services:
  migrate:
    image: ghcr.io/ripmav/erdbeerpfoetchen:${IMAGE_TAG:-latest}
    command: ["--config", "/config/config.yaml", "migrate"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  api:
    image: ghcr.io/ripmav/erdbeerpfoetchen:${IMAGE_TAG:-latest}
    command: ["--config", "/config/config.yaml", "api"]
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
