services:
  db:
    image: postgres:18-alpine3.23
    profiles:
      - local-db
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    image: ghcr.io/ripmav/erdbeerpfoetchen:latest
    command: ["--config", "/config/config.yaml", "migrate"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
        required: false  # not needed when using an external database
    restart: on-failure  # retry until the database is reachable

  api:
    image: ghcr.io/ripmav/erdbeerpfoetchen:latest
    command: ["--config", "/config/config.yaml", "api"]
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
